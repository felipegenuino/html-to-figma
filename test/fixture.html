<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1000px; font-family: Arial; }

  /* 1. Flex row com um filho position:relative no meio (testa reorder por paint order) */
  .flex-row { display: flex; flex-direction: row; gap: 20px; padding: 16px; background: #eee; }
  .flex-row > .item { width: 100px; height: 60px; background: #cdf; }
  .flex-row > .rel { position: relative; z-index: 1; background: #fcd; }

  /* 2. CSS grid 3 colunas */
  .grid { display: grid; grid-template-columns: 200px 200px 200px; gap: 12px; padding: 10px; background: #dfd; }
  .grid > .card { height: 80px; background: #9c9; }

  /* 3. Container normal (block) com filho absoluto sobreposto */
  .stack { position: relative; height: 120px; background: #ffe; }
  .stack > .abs { position: absolute; top: 10px; left: 30px; width: 80px; height: 80px; background: #f99; }

  /* 4. Background-image (data URI) */
  .bg {
    width: 120px; height: 120px;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzM2NiIvPjwvc3ZnPg==");
    background-size: cover;
  }

  /* 5. Pseudo-elemento ::before com texto */
  .pseudo { position: relative; width: 200px; height: 40px; background: #eef; }
  .pseudo::before { content: "★ before"; color: #c00; font-size: 14px; }

  /* 6. Rotação */
  .rot { width: 100px; height: 40px; background: #ccf; transform: rotate(30deg); margin: 40px; }

  /* 7. Borda só num lado (border-bottom) */
  .single-border { width: 200px; height: 40px; background: #fff; border-bottom: 3px solid rgb(51, 51, 51); }

  /* 8. Borda multicolor (acento border-left azul + resto cinza) */
  .multi-border {
    width: 200px; height: 40px; background: #fff;
    border: 1px solid rgb(204, 204, 204);
    border-left: 4px solid rgb(0, 102, 255);
  }

  /* 9. radial-gradient */
  .radial { width: 120px; height: 120px; background: radial-gradient(circle at 50% 50%, rgb(255, 0, 0), rgb(0, 0, 255)); }

  /* 10. conic-gradient */
  .conic { width: 120px; height: 120px; background: conic-gradient(from 90deg at 50% 50%, rgb(255, 0, 0), rgb(0, 255, 0), rgb(0, 0, 255)); }

  /* 12. Grid com colunas não-uniformes (1fr 2fr 1fr) */
  .grid-nu { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; padding: 10px; background: #def; }
  .grid-nu > .cell { height: 50px; background: #8ad; }

  /* 13. Grid com posicionamento explícito + spans */
  .grid-exp { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(2, 50px); gap: 8px; padding: 8px; background: #fed; }
  .grid-exp > .wide { grid-column: 1 / 3; background: #fa8; }
  .grid-exp > .tall { grid-column: 3; grid-row: 1 / 3; background: #8af; }
  .grid-exp > .cx { background: #af8; }
  .grid-exp > .cy { background: #f8a; }

  /* 21. Overlay interativo escondido (menu) → vira frame "click" separado */
  .menu-overlay { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; background: rgb(17, 17, 17); }
  .menu-overlay .menu-link { color: rgb(255, 255, 255); font-size: 24px; }

  /* 20. Conteúdo escondido por scroll-reveal (opacity:0 + visibility:hidden) */
  .reveal-test { opacity: 0; visibility: hidden; font-size: 16px; color: rgb(10, 20, 30); }

  /* 19. <img> com border, box-shadow e opacity */
  .img-styled { width: 80px; height: 80px; border: 2px solid rgb(0, 0, 0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); opacity: 0.8; border-radius: 8px; }

  /* 18. Texto com gradiente (background-clip: text) */
  .grad-text {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(90deg, rgb(255, 0, 0), rgb(0, 0, 255));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }

  /* 17. text-shadow */
  .tshadow { font-size: 20px; color: rgb(34, 34, 34); text-shadow: 2px 3px 4px rgba(0, 0, 0, 0.5); }

  /* 16. mix-blend-mode */
  .blend { width: 120px; height: 60px; background: #c33; mix-blend-mode: multiply; }

  /* 15. background-size: contain (deve virar FIT) */
  .bg-contain {
    width: 120px; height: 120px;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzM2NiIvPjwvc3ZnPg==");
    background-size: contain;
    background-repeat: no-repeat;
  }

  /* 14. Blur: filter (layer) e backdrop-filter (glass) */
  .blurred { width: 120px; height: 80px; background: #33aa77; filter: blur(4px); }
  .glass { width: 120px; height: 80px; background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px); }

  /* 11. Múltiplas camadas: gradiente linear (topo) sobre radial (fundo) */
  .stacked-bg {
    width: 120px; height: 120px;
    background-image:
      linear-gradient(180deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0)),
      radial-gradient(circle at 50% 50%, rgb(255, 200, 0), rgb(200, 0, 0));
  }

  section { margin: 20px; }
</style>
</head>
<body>
  <section class="flex-row">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="rel">C (relative)</div>
    <div class="item">D</div>
  </section>

  <section class="grid">
    <div class="card">1</div><div class="card">2</div><div class="card">3</div>
    <div class="card">4</div><div class="card">5</div><div class="card">6</div>
  </section>

  <section class="stack">
    <div class="abs">abs</div>
  </section>

  <section class="bg"></section>
  <section class="pseudo">conteúdo</section>
  <section class="rot">girado</section>

  <section class="single-border"></section>
  <section class="multi-border"></section>
  <section class="radial"></section>
  <section class="conic"></section>
  <section class="stacked-bg"></section>
  <section class="grid-nu"><div class="cell">a</div><div class="cell">b</div><div class="cell">c</div></section>
  <section class="grid-exp"><div class="wide">wide</div><div class="tall">tall</div><div class="cx">x</div><div class="cy">y</div></section>
  <section class="blurred"></section>
  <section class="glass"></section>
  <section class="bg-contain"></section>
  <section class="blend"></section>
  <section class="tshadow">sombra</section>
  <section class="grad-text">degrade</section>
  <img class="img-styled" alt="" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCI+PHJlY3Qgd2lkdGg9IjgwIiBoZWlnaHQ9IjgwIiBmaWxsPSIjMzY2Ii8+PC9zdmc+">
  <section class="reveal-test">revelado</section>
  <div class="menu-overlay"><a class="menu-link">Menu Aberto</a></div>
</body>
</html>
