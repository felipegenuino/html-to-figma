<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 12px;
      font: 13px/1.4 system-ui, sans-serif;
      background: #1e1e1e;
      color: #eee;
    }
    h1 { font-size: 13px; margin: 0 0 10px; }
    button {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: #0d99ff;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.secondary { background: #383838; }
    button:hover { filter: brightness(1.1); }
    #status { min-height: 16px; color: #9c9; font-size: 12px; }
    #status.error { color: #e88; }
  </style>
</head>
<body>
  <h1>HTML → Figma</h1>
  <button id="capture-page">Capturar página inteira</button>
  <button id="pick-element" class="secondary">Selecionar elemento…</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
